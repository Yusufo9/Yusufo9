<svg xmlns="http://www.w3.org/2000/svg" width="900" height="310" viewBox="0 0 900 310" font-family="'Courier New', Courier, 'Lucida Console', monospace">
  <title>{{USERNAME}} - GitHub metrics</title>
  <style>
    .fade-up { opacity: 0; animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .fade-in { opacity: 0; animation: fadeIn 1.2s ease-in-out forwards; }
    .tile    { opacity: 0; animation: tileIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .pulse   { animation: pulse 3s ease-in-out infinite; }
    .glowBorder { animation: borderGlow 3.2s ease-in-out infinite; }
    .spin    { transform-box: fill-box; transform-origin: center; animation: spin 14s linear infinite; }
    .pixel   { shape-rendering: crispEdges; }
    .label   { font-size: 10px; letter-spacing: 2px; font-weight: 700; }
    .num     { font-size: 30px; font-weight: 700; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes tileIn { from { opacity: 0; transform: translateY(18px) scale(0.96); transform-box: fill-box; transform-origin: center; } to { opacity: 1; transform: translateY(0) scale(1); transform-box: fill-box; transform-origin: center; } }
    @keyframes pulse  { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    @keyframes borderGlow { 0%, 100% { stroke-opacity: 0.45; } 50% { stroke-opacity: 1; } }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur">
        <animate attributeName="stdDeviation" values="2;6;2" dur="3.2s" repeatCount="indefinite"
                 calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1"/>
      </feGaussianBlur>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0 H0 V20" fill="none" stroke="#21262d" stroke-width="0.6"/>
    </pattern>
    <linearGradient id="tileBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <!-- Card -->
  <rect width="900" height="310" rx="10" fill="#0d1117"/>
  <rect width="900" height="310" rx="10" fill="url(#grid)"/>
  <rect x="0.75" y="0.75" width="898.5" height="308.5" rx="10" fill="none" stroke="#ffb454" stroke-width="1.5" class="glowBorder" filter="url(#glow)"/>

  <!-- ===== GITHUB METRICS ===== -->
  <g class="fade-up">
    <rect x="30" y="24" width="6" height="6" fill="#ffb454" class="pixel pulse"/>
    <text x="44" y="31" font-size="13" fill="#ffb454" letter-spacing="3" font-weight="700" filter="url(#softGlow)">[ GITHUB METRICS ]</text>
    <line x1="255" y1="28" x2="870" y2="28" stroke="#21262d"/>
    <text x="870" y="20" font-size="9" fill="#7a7a7a" text-anchor="end" letter-spacing="1">@{{USERNAME}}</text>
  </g>

  <!-- Tiles: x = 30 + i*140 -->
  <g class="tile" style="animation-delay:0.10s">
    <rect x="30" y="48" width="128" height="78" rx="4" fill="url(#tileBg)" stroke="#ffb454" stroke-width="1.2" class="glowBorder"/>
    <rect x="30" y="48" width="128" height="2" fill="#ffb454"/>
    <text x="94" y="66" fill="#ffb454" text-anchor="middle" class="label">STARS</text>
    <text x="94" y="106" fill="#e5e5e5" text-anchor="middle" class="num" filter="url(#softGlow)">{{STARS}}</text>
  </g>
  <g class="tile" style="animation-delay:0.20s">
    <rect x="170" y="48" width="128" height="78" rx="4" fill="url(#tileBg)" stroke="#c5ff4a" stroke-width="1.2" class="glowBorder"/>
    <rect x="170" y="48" width="128" height="2" fill="#c5ff4a"/>
    <text x="234" y="66" fill="#c5ff4a" text-anchor="middle" class="label">REPOS</text>
    <text x="234" y="106" fill="#e5e5e5" text-anchor="middle" class="num" filter="url(#softGlow)">{{REPOS}}</text>
  </g>
  <g class="tile" style="animation-delay:0.30s">
    <rect x="310" y="48" width="128" height="78" rx="4" fill="url(#tileBg)" stroke="#ff5555" stroke-width="1.2" class="glowBorder"/>
    <rect x="310" y="48" width="128" height="2" fill="#ff5555"/>
    <text x="374" y="66" fill="#ff5555" text-anchor="middle" class="label">FOLLOWERS</text>
    <text x="374" y="106" fill="#e5e5e5" text-anchor="middle" class="num" filter="url(#softGlow)">{{FOLLOWERS}}</text>
  </g>
  <g class="tile" style="animation-delay:0.40s">
    <rect x="450" y="48" width="128" height="78" rx="4" fill="url(#tileBg)" stroke="#ffbd2e" stroke-width="1.2" class="glowBorder"/>
    <rect x="450" y="48" width="128" height="2" fill="#ffbd2e"/>
    <text x="514" y="66" fill="#ffbd2e" text-anchor="middle" class="label">FOLLOWING</text>
    <text x="514" y="106" fill="#e5e5e5" text-anchor="middle" class="num" filter="url(#softGlow)">{{FOLLOWING}}</text>
  </g>
  <g class="tile" style="animation-delay:0.50s">
    <rect x="590" y="48" width="128" height="78" rx="4" fill="url(#tileBg)" stroke="#55ff55" stroke-width="1.2" class="glowBorder"/>
    <rect x="590" y="48" width="128" height="2" fill="#55ff55"/>
    <text x="654" y="66" fill="#55ff55" text-anchor="middle" class="label">FORKS</text>
    <text x="654" y="106" fill="#e5e5e5" text-anchor="middle" class="num" filter="url(#softGlow)">{{FORKS}}</text>
  </g>
  <g class="tile" style="animation-delay:0.60s">
    <rect x="730" y="48" width="140" height="78" rx="4" fill="url(#tileBg)" stroke="#ffb454" stroke-width="1.2" class="glowBorder"/>
    <rect x="730" y="48" width="140" height="2" fill="#ffb454"/>
    <text x="800" y="66" fill="#ffb454" text-anchor="middle" class="label">COMMITS</text>
    <text x="800" y="106" fill="#e5e5e5" text-anchor="middle" class="num" filter="url(#softGlow)">{{COMMITS}}</text>
  </g>

  <!-- ===== STREAK STATS ===== -->
  <g class="fade-up" style="animation-delay:0.7s">
    <rect x="30" y="152" width="6" height="6" fill="#ff5555" class="pixel pulse"/>
    <text x="44" y="159" font-size="13" fill="#ff5555" letter-spacing="3" font-weight="700" filter="url(#softGlow)">[ GITHUB STREAK STATS ]</text>
    <line x1="300" y1="156" x2="870" y2="156" stroke="#21262d"/>
  </g>

  <g class="fade-up" style="animation-delay:0.85s">
    <rect x="30" y="172" width="840" height="112" rx="4" fill="#161b22" stroke="#21262d"/>
    <line x1="310" y1="186" x2="310" y2="270" stroke="#21262d"/>
    <line x1="590" y1="186" x2="590" y2="270" stroke="#21262d"/>

    <!-- Total contributions -->
    <text x="170" y="222" fill="#e5e5e5" text-anchor="middle" font-size="30" font-weight="700" filter="url(#softGlow)">{{TOTAL_CONTRIBUTIONS}}</text>
    <text x="170" y="244" fill="#ffb454" text-anchor="middle" font-size="11" letter-spacing="1" font-weight="700">Total Contributions</text>
    <text x="170" y="262" fill="#7a7a7a" text-anchor="middle" font-size="10">{{CONTRIB_RANGE}}</text>

    <!-- Current streak (ring) -->
    <g>
      <circle cx="450" cy="214" r="32" fill="#0d1117" stroke="#3e2815" stroke-width="4"/>
      <circle cx="450" cy="214" r="32" fill="none" stroke="#ff5555" stroke-width="4" stroke-linecap="round"
              stroke-dasharray="50 151" class="spin" filter="url(#softGlow)"/>
      <circle cx="450" cy="214" r="32" fill="none" stroke="#ffb454" stroke-width="1" stroke-opacity="0.5" class="pulse"/>
      <text x="450" y="223" fill="#ff5555" text-anchor="middle" font-size="24" font-weight="700" filter="url(#softGlow)">{{CURRENT_STREAK}}</text>
    </g>
    <text x="450" y="263" fill="#ff5555" text-anchor="middle" font-size="11" letter-spacing="1" font-weight="700">Current Streak</text>
    <text x="450" y="277" fill="#7a7a7a" text-anchor="middle" font-size="10">{{CURRENT_STREAK_RANGE}}</text>

    <!-- Longest streak -->
    <text x="730" y="222" fill="#e5e5e5" text-anchor="middle" font-size="30" font-weight="700" filter="url(#softGlow)">{{LONGEST_STREAK}}</text>
    <text x="730" y="244" fill="#c5ff4a" text-anchor="middle" font-size="11" letter-spacing="1" font-weight="700">Longest Streak</text>
    <text x="730" y="262" fill="#7a7a7a" text-anchor="middle" font-size="10">{{LONGEST_STREAK_RANGE}}</text>
  </g>

  <text x="870" y="299" font-size="9" fill="#7a7a7a" text-anchor="end" letter-spacing="1" class="fade-in" style="animation-delay:1.2s">synced {{UPDATED_AT}}</text>
</svg>
