<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" font-family="'Courier New', Courier, 'Lucida Console', monospace">
  <title>Yusufo9 - dev tech stack</title>
  <style>
    .fade-up { opacity: 0; animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .fade-in { opacity: 0; animation: fadeIn 1.2s ease-in-out forwards; }
    .card    { opacity: 0; animation: cardIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .badge   { opacity: 0; animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    .pulse   { animation: pulse 3s ease-in-out infinite; }
    .glowBorder { animation: borderGlow 3.2s ease-in-out infinite; }
    .pixel   { shape-rendering: crispEdges; }
    .cardTitle { font-size: 12px; font-weight: 700; letter-spacing: 2px; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes cardIn { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes popIn  { from { opacity: 0; transform: scale(0.85); transform-box: fill-box; transform-origin: center; } to { opacity: 1; transform: scale(1); transform-box: fill-box; transform-origin: center; } }
    @keyframes pulse  { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    @keyframes borderGlow { 0%, 100% { stroke-opacity: 0.45; } 50% { stroke-opacity: 1; } }
  </style>

  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur">
        <animate attributeName="stdDeviation" values="2;6;2" dur="3.2s" repeatCount="indefinite"
                 calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1"/>
      </feGaussianBlur>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0 H0 V20" fill="none" stroke="#21262d" stroke-width="0.6"/>
    </pattern>
    <!-- dark glass -->
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.015"/>
    </linearGradient>
  </defs>

  <!-- Card -->
  <rect width="900" height="230" rx="10" fill="#0d1117"/>
  <rect width="900" height="230" rx="10" fill="url(#grid)"/>
  <rect x="0.75" y="0.75" width="898.5" height="228.5" rx="10" fill="none" stroke="#c5ff4a" stroke-width="1.5" class="glowBorder" filter="url(#glow)"/>

  <!-- Pixelized header -->
  <g class="fade-up">
    <g fill="#c5ff4a" class="pixel pulse">
      <rect x="30" y="24" width="5" height="5"/><rect x="36" y="24" width="5" height="5"/><rect x="42" y="24" width="5" height="5"/>
      <rect x="30" y="30" width="5" height="5"/><rect x="42" y="30" width="5" height="5"/>
      <rect x="30" y="36" width="5" height="5"/><rect x="36" y="36" width="5" height="5"/><rect x="42" y="36" width="5" height="5"/>
    </g>
    <text x="58" y="38" font-size="18" fill="#c5ff4a" letter-spacing="4" font-weight="700" filter="url(#softGlow)">MY DEV TECH STACK</text>
    <text x="870" y="36" font-size="9" fill="#7a7a7a" text-anchor="end" letter-spacing="1">// tools i build with</text>
    <line x1="30" y1="52" x2="870" y2="52" stroke="#21262d"/>
    <rect x="30" y="51" width="120" height="2" fill="#c5ff4a" class="pixel"/>
  </g>

  <!-- Card 1: DEVOPS // BACKEND  (x 30..320) -->
  <g class="card" style="animation-delay:0.2s">
    <rect x="30" y="70" width="290" height="140" rx="6" fill="#161b22"/>
    <rect x="30" y="70" width="290" height="140" rx="6" fill="url(#glass)" stroke="#ffb454" stroke-width="1.2" class="glowBorder"/>
    <rect x="40" y="86" width="6" height="6" fill="#ffb454" class="pixel pulse"/>
    <text x="54" y="93" fill="#ffb454" class="cardTitle">DEVOPS // BACKEND</text>
    <line x1="40" y1="102" x2="310" y2="102" stroke="#21262d"/>
  </g>
  <g font-weight="700"><g class="badge" style="animation-delay:0.40s"><rect x="40" y="114" width="64" height="24" rx="2" fill="#0d1117" stroke="#ffb454" stroke-width="1.5" opacity="0.9"/><rect x="44" y="122" width="8" height="8" fill="#ffb454"/><text x="57" y="130.5" fill="#ffb454" font-size="12">Docker</text></g><g class="badge" style="animation-delay:0.55s"><rect x="112" y="114" width="57" height="24" rx="2" fill="#0d1117" stroke="#ffb454" stroke-width="1.5" opacity="0.9"/><rect x="116" y="122" width="8" height="8" fill="#ffb454"/><text x="129" y="130.5" fill="#ffb454" font-size="12">Linux</text></g><g class="badge" style="animation-delay:0.70s"><rect x="177" y="114" width="71" height="24" rx="2" fill="#0d1117" stroke="#ffb454" stroke-width="1.5" opacity="0.9"/><rect x="181" y="122" width="8" height="8" fill="#ffb454"/><text x="194" y="130.5" fill="#ffb454" font-size="12">Node.js</text></g><g class="badge" style="animation-delay:0.85s"><rect x="40" y="148" width="64" height="24" rx="2" fill="#0d1117" stroke="#ffb454" stroke-width="1.5" opacity="0.9"/><rect x="44" y="156" width="8" height="8" fill="#ffb454"/><text x="57" y="164.5" fill="#ffb454" font-size="12">Python</text></g><g class="badge" style="animation-delay:1.00s"><rect x="112" y="148" width="92" height="24" rx="2" fill="#0d1117" stroke="#ffb454" stroke-width="1.5" opacity="0.9"/><rect x="116" y="156" width="8" height="8" fill="#ffb454"/><text x="129" y="164.5" fill="#ffb454" font-size="12">PostgreSQL</text></g><g class="badge" style="animation-delay:1.15s"><rect x="212" y="148" width="43" height="24" rx="2" fill="#0d1117" stroke="#ffb454" stroke-width="1.5" opacity="0.9"/><rect x="216" y="156" width="8" height="8" fill="#ffb454"/><text x="229" y="164.5" fill="#ffb454" font-size="12">Git</text></g></g>

  <!-- Card 2: PROBLEM SOLVING (x 330..620) -->
  <g class="card" style="animation-delay:0.35s">
    <rect x="330" y="70" width="290" height="140" rx="6" fill="#161b22"/>
    <rect x="330" y="70" width="290" height="140" rx="6" fill="url(#glass)" stroke="#ff5555" stroke-width="1.2" class="glowBorder"/>
    <rect x="340" y="86" width="6" height="6" fill="#ff5555" class="pixel pulse"/>
    <text x="354" y="93" fill="#ff5555" class="cardTitle">PROBLEM SOLVING</text>
    <line x1="340" y1="102" x2="610" y2="102" stroke="#21262d"/>
  </g>
  <g font-weight="700"><g class="badge" style="animation-delay:0.40s"><rect x="340" y="114" width="43" height="24" rx="2" fill="#0d1117" stroke="#ff5555" stroke-width="1.5" opacity="0.9"/><rect x="344" y="122" width="8" height="8" fill="#ff5555"/><text x="357" y="130.5" fill="#ff5555" font-size="12">C++</text></g><g class="badge" style="animation-delay:0.55s"><rect x="391" y="114" width="92" height="24" rx="2" fill="#0d1117" stroke="#ff5555" stroke-width="1.5" opacity="0.9"/><rect x="395" y="122" width="8" height="8" fill="#ff5555"/><text x="408" y="130.5" fill="#ff5555" font-size="12">Algorithms</text></g><g class="badge" style="animation-delay:0.70s"><rect x="340" y="148" width="127" height="24" rx="2" fill="#0d1117" stroke="#ff5555" stroke-width="1.5" opacity="0.9"/><rect x="344" y="156" width="8" height="8" fill="#ff5555"/><text x="357" y="164.5" fill="#ff5555" font-size="12">Data Structures</text></g><g class="badge" style="animation-delay:0.85s"><rect x="475" y="148" width="78" height="24" rx="2" fill="#0d1117" stroke="#ff5555" stroke-width="1.5" opacity="0.9"/><rect x="479" y="156" width="8" height="8" fill="#ff5555"/><text x="492" y="164.5" fill="#ff5555" font-size="12">LeetCode</text></g></g>

  <!-- Card 3: WEB STACK (x 630..870) -->
  <g class="card" style="animation-delay:0.5s">
    <rect x="630" y="70" width="240" height="140" rx="6" fill="#161b22"/>
    <rect x="630" y="70" width="240" height="140" rx="6" fill="url(#glass)" stroke="#c5ff4a" stroke-width="1.2" class="glowBorder"/>
    <rect x="640" y="86" width="6" height="6" fill="#c5ff4a" class="pixel pulse"/>
    <text x="654" y="93" fill="#c5ff4a" class="cardTitle">WEB STACK</text>
    <line x1="640" y1="102" x2="860" y2="102" stroke="#21262d"/>
  </g>
  <g font-weight="700"><g class="badge" style="animation-delay:0.40s"><rect x="640" y="114" width="92" height="24" rx="2" fill="#0d1117" stroke="#c5ff4a" stroke-width="1.5" opacity="0.9"/><rect x="644" y="122" width="8" height="8" fill="#c5ff4a"/><text x="657" y="130.5" fill="#c5ff4a" font-size="12">TypeScript</text></g><g class="badge" style="animation-delay:0.55s"><rect x="740" y="114" width="57" height="24" rx="2" fill="#0d1117" stroke="#c5ff4a" stroke-width="1.5" opacity="0.9"/><rect x="744" y="122" width="8" height="8" fill="#c5ff4a"/><text x="757" y="130.5" fill="#c5ff4a" font-size="12">React</text></g><g class="badge" style="animation-delay:0.70s"><rect x="640" y="148" width="71" height="24" rx="2" fill="#0d1117" stroke="#c5ff4a" stroke-width="1.5" opacity="0.9"/><rect x="644" y="156" width="8" height="8" fill="#c5ff4a"/><text x="657" y="164.5" fill="#c5ff4a" font-size="12">Next.js</text></g><g class="badge" style="animation-delay:0.85s"><rect x="719" y="148" width="78" height="24" rx="2" fill="#0d1117" stroke="#c5ff4a" stroke-width="1.5" opacity="0.9"/><rect x="723" y="156" width="8" height="8" fill="#c5ff4a"/><text x="736" y="164.5" fill="#c5ff4a" font-size="12">Tailwind</text></g><g class="badge" style="animation-delay:1.00s"><rect x="640" y="182" width="92" height="24" rx="2" fill="#0d1117" stroke="#c5ff4a" stroke-width="1.5" opacity="0.9"/><rect x="644" y="190" width="8" height="8" fill="#c5ff4a"/><text x="657" y="198.5" fill="#c5ff4a" font-size="12">HTML / CSS</text></g></g>
</svg>
